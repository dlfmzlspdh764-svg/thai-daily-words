<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8505b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="태국어">
<title>매일 태국어</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="title"><button id="homeBtn" class="hbtn" aria-label="단계 선택">🏠</button><span id="titleText">🇹🇭 매일 태국어</span><span id="lvBadge"></span></div>
  <nav class="tabs" id="tabs" hidden>
    <button data-tab="words" class="active">단어</button>
    <button data-tab="dialog">회화</button>
    <button data-tab="sit">상황별</button>
    <button data-tab="abc">글자·성조</button>
    <button data-tab="quiz">퀴즈</button>
  </nav>
</header>
<main>
  <section id="tab-home"></section>
  <section id="tab-words" hidden>
    <div class="seg"><button data-wv="today" class="on">오늘의 단어</button><button data-wv="all">전체 목록</button></div>
    <div id="wToday">
      <div class="daynav">
        <button id="prev" aria-label="이전 날">◀</button>
        <div class="daylabel"><div id="dateText"></div><div id="dayInfo" class="muted small"></div></div>
        <button id="next" aria-label="다음 날">▶</button>
      </div>
      <div class="row-center"><button id="todayBtn" class="pill">오늘로</button>
        <label class="muted small">하루 <select id="perDay"><option>5</option><option>7</option><option>10</option></select> 단어</label></div>
      <div id="cards"></div>
    </div>
    <div id="wAll" hidden>
      <div class="row-center"><input id="search" type="search" placeholder="검색 (태국어·한국어·발음)">
        <label class="small"><input type="checkbox" id="onlyLearned"> 외운 것만</label></div>
      <div id="list"></div>
      <div class="center"><button id="cacheAll" class="pill">📥 이 단계 음성 오프라인 저장</button><div id="cacheMsg" class="muted small"></div></div>
    </div>
  </section>
  <section id="tab-dialog" hidden></section>
  <section id="tab-sit" hidden></section>
  <section id="tab-abc" hidden></section>
  <section id="tab-quiz" hidden>
    <div class="row-center">
      <label class="small">범위 <select id="quizScope"><option value="seen">지금까지 나온 단어</option><option value="learned">외운 단어만</option><option value="all">이 단계 전체</option></select></label>
      <label class="small">유형 <select id="quizType"><option value="t2k">태국어 → 뜻</option><option value="k2t">뜻 → 태국어</option><option value="listen">듣고 고르기</option><option value="tone">🎵 성조 맞히기</option><option value="mix">섞어서</option></select></label>
    </div>
    <div id="quizBox" class="card"></div>
    <div id="quizScore" class="center muted"></div>
  </section>
  <div id="optbar" class="optbar" hidden>
    <label><input type="checkbox" id="oRom" checked> 로마자</label>
    <label><input type="checkbox" id="oKo" checked> 한글 발음</label>
    <label><input type="checkbox" id="oTone" checked> 성조</label>
  </div>
</main>
<div id="toast" hidden></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
